services:
    app:
        build: .
        ports:
            - "8000:8000"
        environment:
            APP_DEBUG: "false"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: foco_challenge
            DB_USERNAME: foco
            DB_PASSWORD: secret
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: foco_challenge
            MYSQL_USER: foco
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-proot",
                ]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    db_data:
